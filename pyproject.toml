[project]
name = "voice-swapper"
version = "0.1.0"
description = "CycleGAN voice conversion between two speakers using mel spectrograms"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "soundfile>=0.14.0",
    "speechbrain>=1.1.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pre-commit-hooks>=6.0.0",
    "prek>=0.3.10",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "ty>=0.0.32",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = []

[tool.pyright]
# Point Pylance and Pyright at the uv-managed virtual environment.
venvPath = "."
venv = ".venv"
# Resolve imports like cycle_gan.config from the project root.
extraPaths = ["."]

# Only torch and torchaudio come from the PyTorch index. Everything else uses PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
