[project]
name = "voice-swapper"
version = "0.1.0"
description = "CycleGAN voice conversion between two speakers using mel spectrograms"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "faiss-cpu>=1.15.1",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "speechbrain>=1.1.1",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.16.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "pre-commit-hooks>=6.0.0",
    "prek>=0.3.10",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "ty>=0.0.32",
]
download = [
    "deno>=2.9.7",
    "types-yt-dlp>=2026.8.19.20260912",
    "yt-dlp[default]>=2026.8.19",
]

[tool.uv]
package = false
# The download tools stay installed locally, and images that don't need them leave the group out.
default-groups = ["dev", "download"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
# Require types on every parameter and return value, tests included (ANN). Asserts are only for tests (S101).
extend-select = ["ANN", "S101"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = []

[tool.pyright]
# Point Pylance and Pyright at the uv-managed virtual environment.
venvPath = "."
venv = ".venv"
# Resolve imports like cycle_gan.config from the project root.
extraPaths = ["."]
exclude = [".venv"]

# Only torch and torchaudio come from the PyTorch index. Everything else uses PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchaudio = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
